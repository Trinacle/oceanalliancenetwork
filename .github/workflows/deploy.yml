name: Deploy theme to Bluehost

# Auto-deploy on every push to main (skill-standard pipeline).
# rsync over SSH to the Bluehost staging theme folder.
# Gated on the DEPLOY_ENABLED repo variable so you can pause deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:    # manual trigger from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # SSH config with IdentitiesOnly (prevents "Too many auth failures")
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/id_deploy
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh deploy 'echo "connected as $(whoami) on $(hostname)"'

      - name: Ensure deploy target exists
        # mkdir -p creates the full path tree if any parent is missing.
        # rsync alone only creates the final folder, which fails if a
        # parent directory doesn't exist yet.
        run: ssh deploy 'mkdir -p ${{ secrets.DEPLOY_PATH }}'

      - name: Rsync theme to Bluehost staging
        run: |
          rsync -avzc --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            -e "ssh" \
            ./ "deploy:${{ secrets.DEPLOY_PATH }}/"

      - name: Verify deploy (diagnostic)
        # Print the on-disk state so we can see exactly what landed.
        run: |
          ssh deploy 'echo "=== DEPLOY_PATH contents ===" && ls -la ${{ secrets.DEPLOY_PATH }}/ && echo "" && echo "=== style.css size + first line ===" && wc -c ${{ secrets.DEPLOY_PATH }}/assets/css/style.css && head -1 ${{ secrets.DEPLOY_PATH }}/assets/css/style.css && echo "" && echo "=== Searching for old vs new palette ===" && grep -c "5fc8f0" ${{ secrets.DEPLOY_PATH }}/assets/css/style.css && echo "(old cyan count above)" && grep -c "2b6f9e" ${{ secrets.DEPLOY_PATH }}/assets/css/style.css && echo "(new steel-blue count above)" && echo "" && echo "=== Any OTHER oceanalliancenetwork theme folders? ===" && find ~/public_html -maxdepth 5 -type d -name "oceanalliancenetwork" 2>/dev/null'

      - name: Deploy summary
        run: |
          echo "✅ Theme deployed to ${{ secrets.DEPLOY_PATH }}"
          echo "Preview: https://oceanalliancenetwork.org/staging/2135/"
