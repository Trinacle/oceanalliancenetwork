---
# cPanel Git deployment config.
# Tells Bluehost's "Deploy HEAD Commit" button how to publish the theme.
#
# $HOME is auto-set by cPanel to the account home directory
# (e.g. /home1/thefindg on this server).
# DEPLOYPATH is the live theme folder inside the addon domain.

deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/website_76291747/wp-content/themes/oceanalliancenetwork
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -r * $DEPLOYPATH/
    - /bin/cp -r .cpanel.yml .gitattributes .gitignore $DEPLOYPATH/ 2>/dev/null || true
